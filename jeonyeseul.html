<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전예슬 의원 의정활동 관리</title>
<style>
*{box-sizing:border-box}
:root{--main:#1a3a6c;--accent:#2f5496;--bg:#eef1f6;--card:#fff;--line:#d8e0ec;--ink:#222}
body{margin:0;font-family:'맑은 고딕',Malgun Gothic,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
header{position:sticky;top:0;z-index:20;background:var(--main);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header .ttl{font-size:18px;font-weight:800}
header .sub{font-size:12px;opacity:.85}
header .sp{flex:1}
.btn{border:0;border-radius:6px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;background:#fff;color:var(--main)}
.btn.gh{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}
.btn.warn{background:#ffd24d;color:#5a4600}
.btn.save{background:#ffd24d;color:#5a4600;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.dlbox{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);padding:4px 6px;border-radius:8px}
.dlbox select{border:0;border-radius:6px;padding:6px 8px;font-size:12.5px;font-weight:700;background:#fff;color:var(--main);width:auto}
.modetoggle{display:flex;align-items:center;gap:9px}
.modetoggle .ml{font-size:13px;font-weight:800;color:rgba(255,255,255,.5);transition:color .2s}
.modetoggle .ml.on{color:#fff}
.tgl{position:relative;width:56px;height:28px;border-radius:20px;border:0;background:rgba(255,255,255,.35);cursor:pointer;padding:0;transition:background .2s;flex:0 0 auto}
body.edit .tgl{background:#ffd24d}
.tgl .thumb{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .22s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
body.edit .tgl .thumb{transform:translateX(28px)}
nav{display:flex;gap:4px;background:var(--card);padding:8px 16px;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:15;flex-wrap:wrap}
nav button{border:0;background:transparent;padding:8px 14px;font-size:14px;font-weight:600;color:#556;cursor:pointer;border-radius:6px 6px 0 0}
nav button.on{background:var(--main);color:#fff}
main{max-width:1180px;margin:18px auto;padding:0 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px}
h2.sec{font-size:17px;color:var(--main);margin:0 0 14px;border-bottom:2px solid var(--main);padding-bottom:6px}
h3.sub{font-size:14px;color:var(--accent);margin:16px 0 8px}
.editbanner{background:#fff7dd;border:1px solid #ffe08a;color:#7a5c00;padding:8px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;display:none}
body.edit .editbanner{display:block}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px}
th{background:var(--main);color:#fff;padding:6px 5px;text-align:left;white-space:normal;word-break:keep-all;font-size:11.5px}
td{border-bottom:1px solid #eef;padding:5px 6px;vertical-align:top;word-break:keep-all;overflow-wrap:break-word;font-size:12px}
tr:nth-child(even) td{background:#fafbfe}
.scroll{overflow-x:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pi{background:#f7f9fd;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.pi .k{font-size:11px;color:#889;font-weight:700}
.pi .v{font-size:14px;font-weight:700;margin-top:2px;white-space:pre-line;line-height:1.7}
.pgrid .wide{grid-column:span 2}
@media(max-width:700px){.pgrid .wide{grid-column:span 1}}
.pi .v[contenteditable=true]{background:#fffbe8;outline:1px dashed #d8b24a;border-radius:3px;padding:1px 4px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:6px}
.stat .b{background:#f7f9fd;border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;padding:12px;text-align:center}
.stat .b .n{font-size:26px;font-weight:800;color:var(--main)}
.stat .b .l{font-size:12px;color:#667}
.badge{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;font-weight:800;color:#fff;font-size:12px}
.o{background:#c0392b}.t{background:#c99a1e}.x{background:#aab0b6}.n{background:#e2e6ea;color:#889}
.tp{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.tp0{background:#e8934a;color:#fff}.tp1{background:#f2c14e}.tp2{background:#5b9bd5;color:#fff}.tp3{background:#f0a97f}.tp4{background:#77b56a;color:#fff}.tp5{background:#ccc}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.st미착수{background:#eceff3;color:#667}.st추진중{background:#cfe6ff;color:#1a5aa8}.st완료{background:#cdeccf;color:#217a3a}.st보류{background:#ffe0cc;color:#a5581f}.st자료수집{background:#fff0c2;color:#8a6d15}.st접수{background:#eceff3;color:#556}.st처리중{background:#cfe6ff;color:#1a5aa8}.st처리완료{background:#cdeccf;color:#217a3a}.st민원{background:#dfe8ff;color:#2a4b9b}.st현안{background:#ffe3cc;color:#b5590f}.st지역현안{background:#ffe3cc;color:#b5590f}.st관심{background:#e3f2d9;color:#3f7a1f}.st기타{background:#eceff3;color:#556}
.sortbtn.on{background:var(--main);color:#fff;border-color:var(--main)}
.st문체위{background:var(--main);color:#fff}.st타상임위{background:#e7ebf2;color:#556}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid #cdd6e5;border-radius:5px;padding:4px 6px;width:100%;background:#fffdf5}
textarea{resize:vertical;min-height:38px}
.datewrap{display:flex;gap:4px;align-items:center}
.datewrap input{width:auto;min-width:124px}
.datewrap{flex-wrap:wrap}
.scroll td .rowdel{padding:2px 6px}
.today{border:0;background:#e7eefb;color:var(--accent);border-radius:5px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.sortbtn{border:1px solid var(--line);background:#f4f7fc;color:var(--main);border-radius:6px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;margin-right:6px}
.sortbtn:hover{background:#e7eefb}
.detbtn{border:1px solid #d8e0ec;background:#f4f7fc;color:#567;border-radius:14px;padding:3px 10px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.scroll td .detbtn{white-space:normal;padding:2px 6px;font-size:10.5px;line-height:1.2;border-radius:9px}
.scroll td .tp,.scroll td .st{white-space:normal;padding:2px 5px;font-size:10.5px;word-break:keep-all}
.detbtn.has{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal.open{display:flex}
.modalbox{background:#fff;border-radius:12px;max-width:740px;width:100%;padding:20px 24px 26px}
.mh{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:6px}
.mh h3{color:var(--main);font-size:16px;margin:0}
.mclose{border:0;background:#eee;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:800}
.dsec{margin-top:16px}
.dsec h4{font-size:13px;color:var(--accent);margin:0 0 6px;border-left:3px solid var(--accent);padding-left:7px}
.logitem{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed #eee}
.logitem .ld{color:#556;font-size:12px;white-space:nowrap;font-weight:700;padding-top:2px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.szlab{font-size:10px;color:#889;text-align:center;margin-top:2px}
.scroll td textarea{min-height:46px}
.scroll td input,.scroll td select,.scroll td textarea{max-width:100%}
.attrow{display:flex;gap:4px;margin-bottom:4px;align-items:flex-start}
.attrow input{width:42%;min-width:0}
.attrow textarea{flex:1;min-width:0;min-height:34px}
.addrow.sm{padding:3px 9px;font-size:11px;margin-top:2px}
.attv{margin-bottom:4px}.attv b{color:var(--main)}.attv div{color:#555;font-size:12px;white-space:pre-line}
.actrow{display:flex;flex-direction:column;gap:3px;margin-bottom:7px;padding-bottom:6px;border-bottom:1px dashed #e6e6ee}
.actrow textarea{width:100%;min-height:34px}
.actv{margin-bottom:5px;padding-bottom:4px;border-bottom:1px dashed #eee;font-size:12.5px;white-space:pre-line}
.actv .ld{display:inline-block;color:#fff;background:var(--main);border-radius:4px;padding:0 6px;font-size:11px;font-weight:700;margin-right:5px;white-space:nowrap}
.mwsec{margin:18px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--line);font-size:15px;font-weight:800}
.mwsec:first-child{margin-top:2px}
.mwgroup{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;background:#fbfcfe}
.mwhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mwtitle{font-size:16px;font-weight:800;color:var(--main)}
.mwmeta{font-size:12.5px;color:#556;flex:1;min-width:120px}
.mwdept{margin:7px 0 2px;font-size:12px;color:#556;display:flex;flex-wrap:wrap;gap:6px}
.mwdept span{background:#eef2fb;border-radius:5px;padding:1px 8px}
.mwsteps{margin-top:9px;border-left:2px solid var(--main);padding-left:13px}
.mwstep{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #eee}
.mwstep:last-child{border-bottom:0}
.mwstep>.ld{color:#fff;background:var(--main);border-radius:4px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap;margin-top:2px}
.mwbody{flex:1;min-width:0}
.mwc{font-size:13.5px;white-space:pre-line}
.mwsub{font-size:12px;color:#667;margin-top:3px;white-space:pre-line}
.mwthumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mwthumbs img{width:60px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--line)}
.mwfiles{margin-top:5px;display:flex;flex-direction:column;gap:2px}
.th2{position:relative}
.th2 img{width:96px;height:96px;object-fit:cover;border-radius:6px;border:1px solid #ddd;cursor:pointer}
.th2 button{position:absolute;top:-7px;right:-7px;background:#c0392b;color:#fff;border:0;border-radius:50%;width:20px;height:20px;cursor:pointer;font-weight:800;line-height:1}
.fitem{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed #eee;font-size:13px}
.up{display:inline-block;margin-top:6px}
.disp input,.disp select,.disp textarea{display:none}
.rowdel{background:#f7d7d7;color:#a33;border:0;border-radius:5px;padding:3px 8px;font-weight:800;cursor:pointer}
.addrow{background:#e5efe6;color:#217a3a;border:1px dashed #9c9;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer;margin-top:8px}
.editonly{display:none}body.edit .editonly{display:inline-block}
.viewonly{}body.edit .viewonly{display:none}
a.link{color:var(--accent);font-weight:700;text-decoration:none}a.link:hover{text-decoration:underline}
.photo{width:96px;height:120px;border-radius:8px;object-fit:cover;border:2px solid var(--line);background:#f0f0f0}
.dir{width:100%;min-height:120px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:8px;opacity:0;transition:.3s;z-index:50;font-weight:700}
.toast.show{opacity:.95}
.muted{color:#889;font-size:12px}
@media print{
  @page{margin:12mm 10mm}
  header,nav,.editbanner,.editonly,.btn,.sortbtn,.detbtn,.addrow,.rowdel,.today,.modetoggle,#syncbox,#lockBtn,#modal,#mafov{display:none!important}
  html,body{background:#fff!important}
  body{font-size:11px}
  main{margin:0!important;max-width:none!important;width:auto!important;padding:0!important}
  .card{border:0;padding:0;margin:0 0 10px;box-shadow:none}
  .scroll{overflow:visible!important}                 /* 넓은 표가 잘리지 않게 */
  table{width:100%!important;font-size:10px;border-collapse:collapse}
  th,td{white-space:normal!important;word-break:break-word;overflow-wrap:anywhere}
  thead{display:table-header-group}                    /* 표 머리행을 매 페이지 반복 */
  tr,.mwgroup,.mwstep,.logitem,.attv,.stat .b,.pi,.pcard{break-inside:avoid;page-break-inside:avoid}
  h2.sec,h3.sub,.mwsec{break-after:avoid;page-break-after:avoid}
  .mwthumbs img{width:120px;height:auto}
  a{color:#000;text-decoration:none}
}
</style></head>
<body>
<header>
  <div><div class="ttl">전예슬 의원 의정활동 관리</div><div class="sub">제12대 경기도의회 · 문화체육관광위원회 · 오산2 (제2선거구)</div></div>
  <span class="sp"></span>
  <div class="modetoggle" title="기본/편집 전환">
    <span class="ml on" id="lblView">기본</span>
    <button class="tgl" id="tgl" onclick="toggleMode()"><span class="thumb"></span></button>
    <span class="ml" id="lblEdit">편집</span>
  </div>
  <button class="btn save editonly" onclick="saveState()">💾 저장</button>
  <span id="syncbox" style="display:none;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:4px 6px 4px 10px;border-radius:8px;font-size:12px"><span id="syncStat" style="font-weight:700;white-space:nowrap">☁ 동기화</span><button class="btn" style="padding:4px 8px" onclick="syncNow()" title="다른 기기의 최신 자료 불러오기">🔄</button></span>
  <span class="dlbox">
    <select id="dlfmt" title="한글은 RTF 또는 워드로 받으면 보안 ‘높음’ 그대로도 바로 열립니다. hwpx는 외부생성 파일이라 보안 높음에서 안 열릴 수 있습니다."><option value="rtf" selected>한글(.rtf) · 권장</option><option value="excel">엑셀(.xlsx)</option><option value="docx">워드(.docx)</option><option value="hwp">한글(.hwpx) ⚠</option></select>
    <button class="btn" onclick="downloadTab()">⬇ 이 탭 저장</button>
    <button class="btn" onclick="downloadAll()" title="모든 탭(프로필·공약·조례·발언·일정 등)을 한 파일로 저장">📚 전체 저장</button>
  </span>
  <button class="btn gh" onclick="exportJSON()">🗄 전체백업(JSON)</button>
  <button class="btn gh editonly" onclick="document.getElementById('imp').click()">⬆ 가져오기</button>
  <button class="btn gh" onclick="window.print()">🖨 인쇄</button>
  <button class="btn gh" onclick="printRTF()" title="지금 보이는 화면(이 탭)을 한글(RTF) 문서로 저장합니다">📄 화면 RTF</button>
  <button class="btn gh" id="lockBtn" style="display:none" onclick="lockNow()" title="비밀번호를 다시 입력하도록 잠급니다(공용 PC에서 사용)">🔒 잠금</button>
  <button class="btn gh editonly" onclick="resetState()">↺ 초기화</button>
  <input type="file" id="imp" accept="application/json" style="display:none" onchange="importJSON(this)">
</header>
<nav id="nav"></nav>
<main>
  <div class="editbanner">✏ <b>편집 모드</b>입니다. 표의 칸을 직접 수정하고, ‘+ 행 추가’로 항목을 늘리세요. 마친 뒤 반드시 <b>💾 저장</b>을 누르세요 (이 브라우저에 저장됩니다).</div>
  <div id="content"></div>
</main>
<div class="modal" id="modal"><div class="modalbox"><div class="mh"><h3 id="modaltitle"></h3><button class="mclose" onclick="closeDetail()">✕ 닫기</button></div><div id="modalbody"></div></div></div>
<div class="toast" id="toast"></div>

let DEFAULT_DATA=ENCED?null:PAYLOAD;
let state=null, mode="view", tab="profile";
let schedTopicFilter="__all", mediaTypeFilter="__all", topicKW="";
function topicSuggestions(){
  var s=[];
  function add(v){String(v||"").split(/[·,\/\s]+/).forEach(function(w){w=w.trim();if(w.length>=2&&s.indexOf(w)<0)s.push(w);});}
  (state.priorities||[]).forEach(function(p){add(p.분야);});
  (state.schedule||[]).forEach(function(r){add(r.주제);});
  return s;
}
function roundupBlocks(kw){
  kw=String(kw||"").trim().toLowerCase(); if(!kw)return [];
  var out=[];
  TABS.forEach(function(t){
    if(t[0]==="topic")return;
    blocksFor(t[0]).forEach(function(b){
      var rows=b.rows.filter(function(r){return r.join("  ").toLowerCase().indexOf(kw)>=0;});
      if(rows.length)out.push({title:"【 "+tabLabel(t[0])+" 】 "+b.title, head:b.head, rows:rows, links:b.links, _tab:t[0]});
    });
  });
  return out;
}
function roundupTable(head,rows,links){
  links=links||{};
  var h='<div class="scroll"><table><thead><tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join("")+'</tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr>'+r.map(function(v,ci){
      if(links[ci]&&/^https?:\/\//i.test(v))return '<td><a class="link" href="'+esc(v)+'" target="_blank">'+esc(links[ci])+'</a></td>';
      return '<td style="white-space:pre-line">'+koBreak(esc(v))+'</td>';
    }).join("")+'</tr>';
  });
  return h+'</tbody></table></div>';
}
function distinctVals(sec,key){var s=[];(state[sec]||[]).forEach(function(r){var v=String(r[key]||"").trim();if(v&&s.indexOf(v)<0)s.push(v);});return s.sort(function(a,b){return a.localeCompare(b,"ko");});}
function filterSelect(id,cur,opts,allLabel){
  var o='<option value="__all"'+(cur==="__all"?" selected":"")+'>'+allLabel+'</option>';
  o+=opts.map(function(v){return '<option value="'+esc(v).replace(/"/g,"&quot;")+'"'+(cur===v?" selected":"")+'>'+esc(v)+'</option>';}).join("");
  return '<select onchange="'+id+'=this.value;render()" style="font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;min-width:120px">'+o+'</select>';
}

function load(){try{const s=localStorage.getItem(KEY);var d=s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_DATA));return migrate(d);}catch(e){return JSON.parse(JSON.stringify(DEFAULT_DATA));}}
function migrate(d){try{
if(!d||typeof d!=="object")return JSON.parse(JSON.stringify(DEFAULT_DATA));
if(d.profileVersion!==DEFAULT_DATA.profileVersion){d.profile=JSON.parse(JSON.stringify(DEFAULT_DATA.profile));d.profileVersion=DEFAULT_DATA.profileVersion;}
if(d.dataVersion!==DEFAULT_DATA.dataVersion){/* 큐레이션 참고자료(기고인터뷰) 최신화. 회의발언(do_meeting)은 사용자 자동채움 보존을 위해 리셋 제외 */["do_media"].forEach(function(k){if(DEFAULT_DATA[k])d[k]=JSON.parse(JSON.stringify(DEFAULT_DATA[k]));});
if(Array.isArray(d.priorities))d.priorities.forEach(function(p){if(p&&!p.소관)p.소관=/체육|문화|관광|예술|독서|문화재|도서관|콘텐츠/.test(p.분야||"")?"문체위":"타상임위";});
d.dataVersion=DEFAULT_DATA.dataVersion;}
for(const k in DEFAULT_DATA){if(!(k in d))d[k]=JSON.parse(JSON.stringify(DEFAULT_DATA[k]));}if(d.pledges)d.pledges=d.pledges.filter(p=>!(p.공약&&(p.공약.indexOf("군장병")>=0||p.공약.indexOf("전역하는")>=0)));
if(Array.isArray(d.si_media)&&Array.isArray(d.do_media)){/* 당선 이후 인터뷰는 도의원 활동으로 이동 */
  var mv=d.si_media.filter(function(m){return (m&&((m.제목||"").indexOf("의정 돋보기")>=0||(m.제목||"").indexOf("당선자")>=0||(m.매체||"")==="중부일보"));});
  if(mv.length){d.si_media=d.si_media.filter(function(m){return mv.indexOf(m)<0;});
    mv.forEach(function(m){if(!d.do_media.some(function(x){return x&&x.제목===m.제목;}))d.do_media.push(m);});}

/* ===== 이미지 자동 최적화(온라인용 축소·압축) ===== */
function b64size(d){var i=(d||"").indexOf(",");return i<0?0:Math.round((d.length-i-1)*0.75);}
function fmtSz(n){return n>=1048576?(n/1048576).toFixed(1)+"MB":Math.max(1,Math.round(n/1024))+"KB";}
function compressImage(file,maxSide,q){
  return new Promise(function(res){
    if(!/^image\//i.test(file.type)){var f0=new FileReader();f0.onload=function(e){res(e.target.result);};f0.readAsDataURL(file);return;}
    var fr=new FileReader();
    fr.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        var s=Math.min(1,maxSide/Math.max(w,h));
        var nw=Math.max(1,Math.round(w*s)),nh=Math.max(1,Math.round(h*s));
        try{
          var cv=document.createElement("canvas");cv.width=nw;cv.height=nh;
          var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,nw,nh);
          cx.drawImage(img,0,0,nw,nh);
          var out=cv.toDataURL("image/jpeg",q||0.72);
          res(out.length<e.target.result.length?out:e.target.result);
        }catch(err){res(e.target.result);}
      };
      img.onerror=function(){res(e.target.result);};
      img.src=e.target.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ===== AI 정리 (Gemini via Edge Function) ===== */
var AI_GUIDE="아래 자료를 바탕으로 회의·업무보고 결과 보고서의 '주요 내용'을 작성하세요. 규칙: (1) 반드시 개조식 — 각 항목을 '- '로 시작하는 짧은 줄로. (2) 날짜·시간·장소·참석자는 보고서에 별도 기재되므로 절대 넣지 말 것. (3) 일정 조율·통화·일정잡기 등 준비/행정 절차는 제외. (4) 실제 논의·보고·지적·요청·결정 내용만 간결히. (5) 함께 첨부된 사진·문서(PDF)·음성 파일의 내용도 반드시 직접 확인해 핵심을 반영할 것(손글씨 메모 사진, 녹음, 문서 포함). (6) 새로운 사실을 지어내지 말 것. 제목·머리말 없이 항목만 출력.\n\n[자료]\n";
/* data URL → mime / base64 */
function dataURLmime(u){var m=/^data:([^;,]+)/.exec(String(u));return m?m[1].toLowerCase():"";}
function dataURLb64(u){var i=String(u).indexOf(",");return i<0?"":String(u).slice(i+1);}
/* Gemini가 직접 읽을 수 있는 파일만(이미지·PDF·오디오). 문서(hwp/docx)는 본문 텍스트로만 처리 */
function aiFileMime(u){var m=dataURLmime(u);if(/^image\//.test(m)||/^audio\//.test(m)||m==="application/pdf")return m;return null;}
/* AI 정리용 자료 수집: 텍스트(parts) + 실제 파일(files: 참고자료·첨부·사진을 Gemini에 그대로 전달) */
function aiGatherParts(it,d){
  d=d||{};var parts=[],files=[],total=0,MAXONE=8000000,MAXTOT=14000000;
  if(it.내용)parts.push("논의/보고 내용: "+it.내용);
  if(it.메모)parts.push("메모: "+it.메모);
  (d.log||[]).forEach(function(l){if(l.text)parts.push("처리기록: "+l.text);});
  if(Array.isArray(it.경과))it.경과.forEach(function(a){if(a&&a.활동)parts.push("활동경과: "+(a.날짜?("["+a.날짜+"] "):"")+a.활동);});
  if(d.refnote)parts.push("참고메모: "+d.refnote);
  function addFile(f,tag){var dd=(f&&f.data)||"";if(!dd)return;
    if(/^data:text\/|^data:application\/json/i.test(dd)){var t="";try{t=new TextDecoder("utf-8").decode(dataURLbytes(dd));}catch(e){}if(t)parts.push(tag+"("+(f.name||"파일")+"): "+t);return;}
    var m=aiFileMime(dd);if(!m)return;var b=dataURLb64(dd);if(!b||b.length>MAXONE||total+b.length>MAXTOT)return;total+=b.length;files.push({mime:m,data:b});}
  (d.refaudio||[]).forEach(function(f){addFile(f,"참고자료 파일");});
  (d.files||[]).forEach(function(f){addFile(f,"첨부파일");});
  (d.photos||[]).forEach(function(p){addFile({data:p,name:"사진"},"사진");});
  return {parts:parts,files:files};
}
async function aiCall(text,files){
  var body={text:text};if(files&&files.length)body.files=files;
  var res=await fetch(SYNC_URL+"/functions/v1/ai-summarize",{method:"POST",headers:{apikey:SYNC_KEY,Authorization:"Bearer "+SYNC_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  var j=await res.json();var sum=(j&&j.summary)?String(j.summary).trim():"";
  if(!sum||sum.indexOf("요약 실패")>=0)throw new Error(j&&j.error?j.error:"요약 실패");
  return sum;
}
async function aiSummarize(){
  if(!SYNC_ON){alert("AI 정리는 클라우드(동기화) 설정이 있어야 씁니다.");return;}
  if(!detailCtx)return;
  var sec=detailCtx.sec,i=detailCtx.i,it=state[sec][i],d=ensureD(sec,i),g=aiGatherParts(it,d);
  if(!g.parts.length&&!g.files.length){alert("정리할 자료가 없습니다. 내용·처리기록·참고메모·첨부파일 등을 먼저 입력해 주세요.");return;}
  var btn=document.getElementById("aibtn");if(btn){btn.disabled=true;btn.textContent="🤖 AI 정리 중…";}
  try{
    var sum=await aiCall(AI_GUIDE+g.parts.join("\n"),g.files);
    if(confirm("AI가 정리한 내용입니다"+(g.files.length?(" (첨부 "+g.files.length+"건 반영)"):"")+".\n\n"+sum+"\n\n이 내용을 '내용' 칸에 넣을까요? (기존 내용은 대체됩니다)")){state[sec][i].내용=sum;saveState();renderDetail();toast("AI 정리 내용을 반영했습니다 ✓");}
  }catch(e){alert("AI 정리 실패: "+e.message);}

  s+="\\qc\\b\\fs32 "+rtfT(title)+"\\par\\pard\\ql\\b0\\fs20\n";
  B.forEach(function(b){
    s+="\\par\\b\\fs24\\cf1 "+rtfT("■ "+b.title)+"\\par\\pard\\b0\\fs20\\cf0\n";
    s+=rtfTable(b.head,b.rows,b.links);
  });
  return s+"}";
}
function buildDOC(B,title){
  var h='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>'+esc(title)+'</title>'
   +'<style>body{font-family:"맑은 고딕";font-size:10pt}h1{font-size:15pt;color:#1a3a6c}h2{font-size:12pt;color:#1a3a6c;border-bottom:1.5pt solid #1a3a6c;padding-bottom:3pt;margin-top:16pt}'
   +'table{border-collapse:collapse;width:100%;margin:6pt 0 14pt}th{background:#1a3a6c;color:#fff;border:.5pt solid #999;padding:4pt;font-size:9.5pt;text-align:left}'
   +'td{border:.5pt solid #999;padding:4pt;font-size:9.5pt;vertical-align:top}</style></head><body>';
  h+='<h1>'+esc(title)+'</h1>';
  B.forEach(function(b){
    h+='<h2>'+esc(b.title)+'</h2><table><tr>'+b.head.map(function(x){return '<th>'+esc(x)+'</th>';}).join("")+'</tr>';
    if(!b.rows.length)h+='<tr><td colspan="'+b.head.length+'">(내용 없음)</td></tr>';
    b.rows.forEach(function(r){h+='<tr>'+r.map(function(x){return '<td>'+esc(x).replace(/\n/g,"<br>")+'</td>';}).join("")+'</tr>';});
    h+='</table>';
  });
  return h+'</body></html>';
}
/* ===== 워드(.docx, OOXML) 생성: 순수 JS ZIP · 표/음영/하이퍼링크 ===== */
function xesc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function dRun(text,bold,color,sz){
  var rpr='<w:rPr>'+(bold?'<w:b/>':'')+'<w:rFonts w:ascii="맑은 고딕" w:eastAsia="맑은 고딕" w:hAnsi="맑은 고딕"/><w:sz w:val="'+(sz||18)+'"/>'+(color?'<w:color w:val="'+color+'"/>':'')+'</w:rPr>';
  var t=String(text==null?"":text).split(/\n/).map(function(p,i){return (i?'<w:br/>':'')+'<w:t xml:space="preserve">'+xesc(p)+'</w:t>';}).join("");
  return '<w:r>'+rpr+t+'</w:r>';
}
function dCell(inner,fill,span){
  return '<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/>'+(span?'<w:gridSpan w:val="'+span+'"/>':'')+(fill?'<w:shd w:val="clear" w:color="auto" w:fill="'+fill+'"/>':'')+'</w:tcPr><w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr>'+inner+'</w:p></w:tc>';
}
function buildDOCX(B,title){
  var rels=[];
  function addLink(url){var id="rIdL"+rels.length;rels.push({id:id,url:url});return id;}
  var bd='<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="60"/></w:pPr>'+dRun(title,true,"1A3A6C",32)+'</w:p>';
  /* 부제(의원명) 제거 — 제목에 이미 포함 */
  var borders='<w:tblBorders>'+["top","left","bottom","right","insideH","insideV"].map(function(x){return '<w:'+x+' w:val="single" w:sz="4" w:color="999999"/>';}).join("")+'</w:tblBorders>';
  B.forEach(function(b){
    var lk=b.links||{};
    bd+='<w:p><w:pPr><w:spacing w:before="160" w:after="60"/></w:pPr>'+dRun("■ "+b.title,true,"1A3A6C",24)+'</w:p>';
    var tbl='<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblLayout w:type="autofit"/>'+borders+'</w:tblPr>';
    tbl+='<w:tr><w:trPr><w:tblHeader/></w:trPr>'+b.head.map(function(hh){return dCell(dRun(hh,true,"FFFFFF",18),"1A3A6C");}).join("")+'</w:tr>';
    if(!b.rows.length){tbl+='<w:tr>'+dCell(dRun("(내용 없음)",false,"888888",18),null,b.head.length)+'</w:tr>';}
    b.rows.forEach(function(r){
      tbl+='<w:tr>'+r.map(function(v,ci){
        if(lk[ci]&&/^https?:\/\//i.test(v)){var id=addLink(v);
          return dCell('<w:hyperlink r:id="'+id+'"><w:r><w:rPr><w:rFonts w:ascii="맑은 고딕" w:eastAsia="맑은 고딕" w:hAnsi="맑은 고딕"/><w:sz w:val="18"/><w:color w:val="1155CC"/><w:u w:val="single"/></w:rPr><w:t xml:space="preserve">'+xesc(lk[ci])+'</w:t></w:r></w:hyperlink>',null);}
        return dCell(dRun(v,false,null,18),null);
      }).join("")+'</w:tr>';
    });
    bd+=tbl+'</w:tbl><w:p><w:pPr><w:spacing w:after="0"/></w:pPr></w:p>';
  });
  var doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
   +'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
   +'<w:body>'+bd+'<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>';
  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  var rr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  var dr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +rels.map(function(x){return '<Relationship Id="'+x.id+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="'+xesc(x.url)+'" TargetMode="External"/>';}).join("")+'</Relationships>';
  var E=function(s){return new TextEncoder().encode(s);};
  return zipStore([
    {name:"[Content_Types].xml",data:E(ct)},
    {name:"_rels/.rels",data:E(rr)},
    {name:"word/document.xml",data:E(doc)},
    {name:"word/_rels/document.xml.rels",data:E(dr)}
  ],"application/vnd.openxmlformats-officedocument.wordprocessingml.document");
}

    return p.then(function(data){packed.push({name:e.name,data:data,crc:crc32(e.data),osz:e.data.length,method:stored?0:8});i++;return next();});
  }
  return next().then(function(){

    packed.forEach(function(c){
      var nm=new TextEncoder().encode(c.name);
      var lh=[].concat([80,75,3,4],u16(20),u16(0),u16(c.method),u16(0),u16(0),u32(c.crc),u32(c.data.length),u32(c.osz),u16(nm.length),u16(0));

      cen.push({nm:nm,crc:c.crc,csz:c.data.length,osz:c.osz,off:off,method:c.method});

    cen.forEach(function(c){
      var h=[].concat([80,75,1,2],u16(20),u16(20),u16(0),u16(c.method),u16(0),u16(0),u32(c.crc),u32(c.csz),u32(c.osz),u16(c.nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off));

    return new Blob(chunks.concat(cd,[new Uint8Array(eo)]),{type:"application/hwp+zip"});
  });
}
function hx(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
/* 내용 길이 기반 열폭 계산 (한글=2, 영문=1) */
function dispLen(s){s=String(s==null?"":s);var n=0,mx=0;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);if(c===10){if(n>mx)mx=n;n=0;continue;}n+=(c>0x1100&&c<0xD7FF)||(c>=0xFF00&&c<=0xFFEF)?2:1;}return Math.max(mx,n);}
function colWeights(head,rows){
  var C=head.length,w=[];
  for(var i=0;i<C;i++){
    var m=dispLen(head[i]),sum=0,cnt=0;
    for(var r=0;r<rows.length;r++){var L=dispLen(rows[r][i]);sum+=L;cnt++;if(L>m)m=L;}
    var avg=cnt?sum/cnt:0;
    var v=Math.round(avg*0.6+m*0.4);              // 평균·최대 혼합(한 칸이 과도하게 넓어지지 않게)
    w.push(Math.max(5,Math.min(v,42)));           // 5~42 사이로 제한
  }
  return w;
}

function hpTbl(head,rows){
  var C=head.length,W=42520,h=2600,R=rows.length+1;

   +'<hp:tbl id="'+(1000000+Math.floor(Math.random()*8000000))+'" zOrder="0" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="1" rowCnt="'+R+'" colCnt="'+C+'" cellSpacing="0" borderFillIDRef="3" noAdjust="0">'
   +'<hp:sz width="'+W+'" widthRelTo="ABSOLUTE" height="'+(R*h)+'" heightRelTo="ABSOLUTE" protect="0"/>'

  rows.forEach(function(r,ri){s+='<hp:tr>'+head.map(function(_,ci){return hpTc(r[ci],ri+1,ci,cws[ci],h,3);}).join("")+'</hp:tr>';});

function buildHWPX(B,title){
  var x=b64str(HWPX.secPrefix);

  B.forEach(function(b){
    x+=hpP("");
    x+=hpP("■ "+b.title);
    x+=b.rows.length?hpTbl(b.head,b.rows):hpP("(내용 없음)");
  });
  x+=b64str(HWPX.secSuffix);
  var entries=HWPX.files.map(function(f){return {name:f.name,data:b64bytes(f.b64)};});

  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(PAYLOAD.i)},key,b64d(PAYLOAD.c));
  DEFAULT_DATA=JSON.parse(new TextDecoder().decode(pt));syncPw=pw;return true;
}catch(e){return false;}}
function showGate(){
  var ov=document.createElement("div");ov.id="lockgate";
  ov.style.cssText="position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#eef1f6,#dfe6f0);display:flex;align-items:center;justify-content:center;font-family:'맑은 고딕',Malgun Gothic,sans-serif";
  ov.innerHTML='<div style="background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.18);padding:34px 30px;max-width:340px;width:88%;text-align:center">'
   +'<div style="font-size:34px;margin-bottom:8px">🔒</div>'
   +'<div style="font-size:18px;font-weight:800;color:#1a3a6c;margin-bottom:4px">'+document.title.replace(/ 관리$/,'')+'</div>'
   +'<div style="font-size:13px;color:#667;margin-bottom:18px">열람 비밀번호를 입력하세요.</div>'
   +'<input id="lockpw" type="password" autocomplete="off" placeholder="비밀번호" style="width:100%;padding:11px 12px;font-size:15px;border:1px solid #c5d0e0;border-radius:9px;box-sizing:border-box;text-align:center">'
   +'<div id="lockerr" style="color:#c0392b;font-size:12.5px;height:16px;margin:8px 0 0"></div>'
   +'<button id="lockbtn" style="margin-top:12px;width:100%;padding:11px;font-size:15px;font-weight:700;color:#fff;background:#1a3a6c;border:0;border-radius:9px;cursor:pointer">열기</button>'
   +'<div style="font-size:11px;color:#99a;margin-top:14px;line-height:1.5">비밀번호를 아는 사람만 내용을 볼 수 있습니다.<br>분실 시 복구되지 않습니다.</div></div>';
  document.body.appendChild(ov);
  var inp=ov.querySelector("#lockpw"),btn=ov.querySelector("#lockbtn"),err=ov.querySelector("#lockerr");
  async function submit(){btn.disabled=true;err.textContent="";var ok=await tryUnlock(inp.value);
    if(ok){rememberAuth(inp.value);ov.remove();startApp();}else{err.textContent="비밀번호가 올바르지 않습니다.";btn.disabled=false;inp.value="";inp.focus();}}
  btn.addEventListener("click",submit);
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")submit();});
  setTimeout(function(){inp.focus();},50);
}
/* 같은 컴퓨터에서 하루(24시간) 1회만 비밀번호: 성공 시 이 브라우저에 기억 */
var AUTH_TTL=24*3600*1000;
function rememberAuth(pw){try{localStorage.setItem(KEY+"__auth",JSON.stringify({pw:pw,at:Date.now()}));}catch(e){}}
function clearAuth(){try{localStorage.removeItem(KEY+"__auth");}catch(e){}}
function lockNow(){clearAuth();location.reload();}
async function bootAuth(){
  if(!ENCED){startApp();return;}
  try{var a=JSON.parse(localStorage.getItem(KEY+"__auth")||"null");
    if(a&&a.pw&&a.at&&(Date.now()-a.at)<AUTH_TTL){
      var ok=await tryUnlock(a.pw);
      if(ok){startApp();return;}   /* 최초 입력 시각 기준 24시간 유지(하루 1회) */
      clearAuth();
    }
  }catch(e){}
  showGate();
}
bootAuth();
</script>
