<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>경기도의회 의정활동 관리</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'맑은 고딕',Malgun Gothic,'Segoe UI',sans-serif;background:#eef1f6;color:#222;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:40px 18px 60px}
  h1{font-size:24px;color:#1a3a6c;margin:0 0 4px}
  .sub{color:#667;font-size:13px;margin-bottom:26px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:560px){.cards{grid-template-columns:1fr}}
  a.card{display:block;text-decoration:none;background:#fff;border:1px solid #d8e0ec;border-radius:14px;padding:22px;transition:.15s;border-top:5px solid var(--c)}
  a.card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.1)}
  .card .nm{font-size:20px;font-weight:800;color:var(--c)}
  .card .meta{font-size:13px;color:#556;margin-top:6px}
  .card .go{margin-top:14px;display:inline-block;font-size:13px;font-weight:700;color:var(--c)}
  .foot{margin-top:28px;font-size:12px;color:#889;border-top:1px solid #dde;padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>경기도의회 의정활동 관리</h1>
  <div class="sub">제12대 경기도의회 · 문화체육관광위원회 · 정책지원관 자료</div>
  <div class="cards">
    <a class="card" href="jeonyeseul.html" style="--c:#1a3a6c">
      <div class="nm">전예슬 의원</div>
      <div class="meta">더불어민주당 · 오산 제2선거구<br>前 제9대 오산시의원</div>
      <div class="go">의정활동 페이지 열기 →</div>
    </a>
    <a class="card" href="hangyuchan.html" style="--c:#1a5c2a">
      <div class="nm">한규찬 의원</div>
      <div class="meta">더불어민주당 · 평택 제4선거구<br>제12대 신임</div>
      <div class="go">의정활동 페이지 열기 →</div>
    </a>
  </div>
  <div class="foot">
    각 페이지는 보기/편집 모드 전환, 항목별 처리기록·사진·파일 첨부, 엑셀·한글(RTF/HWPX) 저장을 지원합니다.<br>
    편집 내용은 각 브라우저에 저장되며(localStorage), ‘내보내기(JSON)’로 백업·이관할 수 있습니다.
  </div>
</div>
</body>
</html>
