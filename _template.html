<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box}
:root{--main:__MAIN__;--accent:__ACCENT__;--bg:#eef1f6;--card:#fff;--line:#d8e0ec;--ink:#222}
body{margin:0;font-family:'맑은 고딕',Malgun Gothic,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
header{position:sticky;top:0;z-index:20;background:var(--main);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header .ttl{font-size:18px;font-weight:800}
header .sub{font-size:12px;opacity:.85}
header .sp{flex:1}
.btn{border:0;border-radius:6px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;background:#fff;color:var(--main)}
.btn.gh{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}
.btn.warn{background:#ffd24d;color:#5a4600}
.btn.save{background:#ffd24d;color:#5a4600;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.dlbox{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);padding:4px 6px;border-radius:8px}
.dlbox select{border:0;border-radius:6px;padding:6px 8px;font-size:12.5px;font-weight:700;background:#fff;color:var(--main);width:auto}
.modetoggle{display:flex;align-items:center;gap:9px}
.modetoggle .ml{font-size:13px;font-weight:800;color:rgba(255,255,255,.5);transition:color .2s}
.modetoggle .ml.on{color:#fff}
.tgl{position:relative;width:56px;height:28px;border-radius:20px;border:0;background:rgba(255,255,255,.35);cursor:pointer;padding:0;transition:background .2s;flex:0 0 auto}
body.edit .tgl{background:#ffd24d}
.tgl .thumb{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .22s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
body.edit .tgl .thumb{transform:translateX(28px)}
nav{display:flex;gap:4px;background:var(--card);padding:8px 16px;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:15;flex-wrap:wrap}
nav button{border:0;background:transparent;padding:8px 14px;font-size:14px;font-weight:600;color:#556;cursor:pointer;border-radius:6px 6px 0 0}
nav button.on{background:var(--main);color:#fff}
main{max-width:1180px;margin:18px auto;padding:0 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px}
h2.sec{font-size:17px;color:var(--main);margin:0 0 14px;border-bottom:2px solid var(--main);padding-bottom:6px}
h3.sub{font-size:14px;color:var(--accent);margin:16px 0 8px}
.editbanner{background:#fff7dd;border:1px solid #ffe08a;color:#7a5c00;padding:8px 14px;border-radius:8px;margin-bottom:14px;font-size:13px;display:none}
body.edit .editbanner{display:block}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px}
th{background:var(--main);color:#fff;padding:6px 5px;text-align:left;white-space:normal;word-break:keep-all;font-size:11.5px}
td{border-bottom:1px solid #eef;padding:5px 6px;vertical-align:top;word-break:keep-all;overflow-wrap:break-word;font-size:12px}
tr:nth-child(even) td{background:#fafbfe}
.scroll{overflow-x:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pi{background:#f7f9fd;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.pi .k{font-size:11px;color:#889;font-weight:700}
.pi .v{font-size:14px;font-weight:700;margin-top:2px;white-space:pre-line;line-height:1.7}
.pgrid .wide{grid-column:span 2}
@media(max-width:700px){.pgrid .wide{grid-column:span 1}}
.pi .v[contenteditable=true]{background:#fffbe8;outline:1px dashed #d8b24a;border-radius:3px;padding:1px 4px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:6px}
.stat .b{background:#f7f9fd;border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;padding:12px;text-align:center}
.stat .b .n{font-size:26px;font-weight:800;color:var(--main)}
.stat .b .l{font-size:12px;color:#667}
.badge{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;font-weight:800;color:#fff;font-size:12px}
.o{background:#c0392b}.t{background:#c99a1e}.x{background:#aab0b6}.n{background:#e2e6ea;color:#889}
.tp{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.tp0{background:#e8934a;color:#fff}.tp1{background:#f2c14e}.tp2{background:#5b9bd5;color:#fff}.tp3{background:#f0a97f}.tp4{background:#77b56a;color:#fff}.tp5{background:#ccc}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.st미착수{background:#eceff3;color:#667}.st추진중{background:#cfe6ff;color:#1a5aa8}.st완료{background:#cdeccf;color:#217a3a}.st보류{background:#ffe0cc;color:#a5581f}.st자료수집{background:#fff0c2;color:#8a6d15}.st접수{background:#eceff3;color:#556}.st처리중{background:#cfe6ff;color:#1a5aa8}.st처리완료{background:#cdeccf;color:#217a3a}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid #cdd6e5;border-radius:5px;padding:4px 6px;width:100%;background:#fffdf5}
textarea{resize:vertical;min-height:38px}
.datewrap{display:flex;gap:4px;align-items:center}
.datewrap input{width:auto;min-width:130px}
.today{border:0;background:#e7eefb;color:var(--accent);border-radius:5px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.detbtn{border:1px solid #d8e0ec;background:#f4f7fc;color:#567;border-radius:14px;padding:3px 10px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.detbtn.has{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal.open{display:flex}
.modalbox{background:#fff;border-radius:12px;max-width:740px;width:100%;padding:20px 24px 26px}
.mh{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--main);padding-bottom:8px;margin-bottom:6px}
.mh h3{color:var(--main);font-size:16px;margin:0}
.mclose{border:0;background:#eee;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:800}
.dsec{margin-top:16px}
.dsec h4{font-size:13px;color:var(--accent);margin:0 0 6px;border-left:3px solid var(--accent);padding-left:7px}
.logitem{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed #eee}
.logitem .ld{color:#556;font-size:12px;white-space:nowrap;font-weight:700;padding-top:2px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.szlab{font-size:10px;color:#889;text-align:center;margin-top:2px}
.scroll td textarea{min-height:46px}
.scroll td input,.scroll td select,.scroll td textarea{max-width:100%}
.attrow{display:flex;gap:4px;margin-bottom:4px;align-items:flex-start}
.attrow input{width:42%;min-width:0}
.attrow textarea{flex:1;min-width:0;min-height:34px}
.addrow.sm{padding:3px 9px;font-size:11px;margin-top:2px}
.attv{margin-bottom:4px}.attv b{color:var(--main)}.attv div{color:#555;font-size:12px;white-space:pre-line}
.th2{position:relative}
.th2 img{width:96px;height:96px;object-fit:cover;border-radius:6px;border:1px solid #ddd;cursor:pointer}
.th2 button{position:absolute;top:-7px;right:-7px;background:#c0392b;color:#fff;border:0;border-radius:50%;width:20px;height:20px;cursor:pointer;font-weight:800;line-height:1}
.fitem{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed #eee;font-size:13px}
.up{display:inline-block;margin-top:6px}
.disp input,.disp select,.disp textarea{display:none}
.rowdel{background:#f7d7d7;color:#a33;border:0;border-radius:5px;padding:3px 8px;font-weight:800;cursor:pointer}
.addrow{background:#e5efe6;color:#217a3a;border:1px dashed #9c9;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer;margin-top:8px}
.editonly{display:none}body.edit .editonly{display:inline-block}
.viewonly{}body.edit .viewonly{display:none}
a.link{color:var(--accent);font-weight:700;text-decoration:none}a.link:hover{text-decoration:underline}
.photo{width:96px;height:120px;border-radius:8px;object-fit:cover;border:2px solid var(--line);background:#f0f0f0}
.dir{width:100%;min-height:120px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:8px;opacity:0;transition:.3s;z-index:50;font-weight:700}
.toast.show{opacity:.95}
.muted{color:#889;font-size:12px}
@media print{header,nav,.editbanner,.editonly,.btn{display:none!important}body{background:#fff}.card{border:0;padding:0}main{margin:0}}
</style></head>
<body>
<header>
  <div><div class="ttl">__HEADER_TITLE__</div><div class="sub">__HEADER_SUB__</div></div>
  <span class="sp"></span>
  <div class="modetoggle" title="기본/편집 전환">
    <span class="ml on" id="lblView">기본</span>
    <button class="tgl" id="tgl" onclick="toggleMode()"><span class="thumb"></span></button>
    <span class="ml" id="lblEdit">편집</span>
  </div>
  <button class="btn save editonly" onclick="saveState()">💾 저장</button>
  <span class="dlbox">
    <select id="dlfmt" title="저장 형식 선택"><option value="excel">엑셀(.xlsx)</option><option value="rtf">한글(.rtf)</option><option value="hwp">한글(.hwpx)</option></select>
    <button class="btn" onclick="downloadTab()">⬇ 이 페이지 저장</button>
  </span>
  <button class="btn gh" onclick="exportJSON()">🗄 전체백업(JSON)</button>
  <button class="btn gh editonly" onclick="document.getElementById('imp').click()">⬆ 가져오기</button>
  <button class="btn gh" onclick="window.print()">🖨 인쇄</button>
  <button class="btn gh editonly" onclick="resetState()">↺ 초기화</button>
  <input type="file" id="imp" accept="application/json" style="display:none" onchange="importJSON(this)">
</header>
<nav id="nav"></nav>
<main>
  <div class="editbanner">✏ <b>편집 모드</b>입니다. 표의 칸을 직접 수정하고, ‘+ 행 추가’로 항목을 늘리세요. 마친 뒤 반드시 <b>💾 저장</b>을 누르세요 (이 브라우저에 저장됩니다).</div>
  <div id="content"></div>
</main>
<div class="modal" id="modal"><div class="modalbox"><div class="mh"><h3 id="modaltitle"></h3><button class="mclose" onclick="closeDetail()">✕ 닫기</button></div><div id="modalbody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY="__STORAGE_KEY__";
const DEFAULT_DATA=__DEFAULT_DATA_JSON__;
let state=load(), mode="view", tab="profile";

function load(){try{const s=localStorage.getItem(KEY);let d=s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_DATA));if(d.profileVersion!==DEFAULT_DATA.profileVersion){d.profile=JSON.parse(JSON.stringify(DEFAULT_DATA.profile));d.profileVersion=DEFAULT_DATA.profileVersion;}for(const k in DEFAULT_DATA){if(!(k in d))d[k]=JSON.parse(JSON.stringify(DEFAULT_DATA[k]));}if(d.pledges)d.pledges=d.pledges.filter(p=>!(p.공약&&(p.공약.indexOf("군장병")>=0||p.공약.indexOf("전역하는")>=0)));
if(Array.isArray(d.si_media)&&Array.isArray(d.do_media)){/* 당선 이후 인터뷰는 도의원 활동으로 이동 */
  var mv=d.si_media.filter(function(m){return (m&&((m.제목||"").indexOf("의정 돋보기")>=0||(m.제목||"").indexOf("당선자")>=0||(m.매체||"")==="중부일보"));});
  if(mv.length){d.si_media=d.si_media.filter(function(m){return mv.indexOf(m)<0;});
    mv.forEach(function(m){if(!d.do_media.some(function(x){return x&&x.제목===m.제목;}))d.do_media.push(m);});}
}
if(Array.isArray(d.schedule))d.schedule.forEach(function(s){if(s&&!Array.isArray(s.참석)){s.참석=[];if((s.관련부서&&s.관련부서.trim())||(s.참석자&&s.참석자.trim()))s.참석.push({기관:s.관련부서||"",참석자:s.참석자||""});delete s.관련부서;delete s.참석자;}});
return d;}catch(e){return JSON.parse(JSON.stringify(DEFAULT_DATA));}}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));toast("저장되었습니다 ✓");}catch(e){alert("저장 용량이 초과되었습니다. 사진/파일이 너무 큽니다.\n① 큰 이미지는 줄여서 올리거나 ② ‘내보내기(JSON)’로 백업해 주세요.");}}
function resetState(){if(confirm("모든 수정 내용을 지우고 기본값으로 되돌릴까요?")){localStorage.removeItem(KEY);state=JSON.parse(JSON.stringify(DEFAULT_DATA));render();toast("기본값으로 초기화했습니다");}}
function exportJSON(){const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="전예슬_의정활동_"+new Date().toISOString().slice(0,10)+".json";a.click();}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{state=JSON.parse(e.target.result);saveState();render();toast("가져오기 완료");}catch(x){alert("파일을 읽을 수 없습니다");}};r.readAsText(f);}
function toggleMode(){mode=mode==="view"?"edit":"view";const ed=mode==="edit";document.body.classList.toggle("edit",ed);document.getElementById("lblView").classList.toggle("on",!ed);document.getElementById("lblEdit").classList.toggle("on",ed);render();}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function esc(s){return(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
/* 한글 의미단위 줄바꿈 지점(제로폭 공백) 삽입 — 위원회/조례명 등이 한 글자만 떨어지지 않게 */
function koBreak(s){
  return String(s==null?"":s)
    .replace(/(특별위원회|위원회|위원장|본부|사업소|추진단)/g,"​$1")
    .replace(/(」|\))\s*\//g,"$1​ /")
    .replace(/(에 관한|에 대한|및 |등 )/g,"$1​");
}
function upd(sec,i,k,v){state[sec][i][k]=v;}
function updP(k,v){state.profile[k]=v;}
function updMat(k,i,j,v){state.profile[k][i][j]=v;}
function addRow(sec,tpl){state[sec].push(JSON.parse(JSON.stringify(tpl)));render();}
function delRow(sec,i){if(confirm("이 행을 삭제할까요?")){state[sec].splice(i,1);render();}}
function addMat(k,n){state.profile[k].push(Array(n).fill(""));render();}
function delMat(k,i){state.profile[k].splice(i,1);render();}
function addAtt(sec,i){var r=state[sec][i];if(!Array.isArray(r.참석))r.참석=[];r.참석.push({기관:"",참석자:""});render();}
function delAtt(sec,i,ai){state[sec][i].참석.splice(ai,1);render();}
function updAtt(sec,i,ai,k,val){state[sec][i].참석[ai][k]=val;}

const TABS=[["profile", "🏠 프로필·개요"], ["pledges", "📌 공약관리"], ["do_ord", "📜 조례"], ["do_sp", "🎤 5분발언"], ["do_meeting", "🗣 회의 발언"], ["do_q", "❓ 도정질문"], ["do_media", "📰 기고·인터뷰"], ["minwon", "📮 민원관리"], ["schedule", "📅 일정"]];
const PRI_COLS=[{key:"순위",label:"순위"},{key:"분야",label:"분야"},{key:"핵심과제",label:"핵심 과제",type:"ta"},{key:"필요활동",label:"필요 활동 (조례·발언·토론회·예산 등)",type:"ta"},{key:"상태",label:"상태",type:"status",opts:["구상","준비","추진중","완료","보류"]},{key:"메모",label:"메모",type:"ta"}];
const PRI_TPL={"순위":"","분야":"","핵심과제":"","필요활동":"","상태":"구상","메모":""};
const PLEDGE_COLS=[{key:"공약",label:"공약"},{key:"시장",label:"시장",type:"badge"},{key:"국회",label:"국회",type:"badge"},{key:"유형",label:"겹침유형",type:"tp"},{key:"상태",label:"추진상태",type:"status",opts:["미착수","자료수집","추진중","완료","보류"]},{key:"관련조례",label:"관련 경기도 조례"},{key:"소관",label:"소관 상임위"},{key:"메모",label:"메모"}];
const PLEDGE_TPL={"공약":"","시장":"","국회":"","유형":"미검토","상태":"미착수","관련조례":"","소관":"","메모":""};
const ORD_COLS=[{key:"의안번호",label:"의안번호"},{key:"의안명",label:"의안명"},{key:"유형",label:"유형"},{key:"발의일",label:"발의일",type:"date"},{key:"처리결과",label:"처리결과"},{key:"원문",label:"의안",type:"link",linkText:"📄 의안"}];
const ORD_TPL={"의안번호":"","의안명":"","유형":"","발의일":"","처리결과":"","원문":""};
const SP_COLS=[{key:"회기",label:"회기"},{key:"차수",label:"차수"},{key:"일자",label:"일자",type:"date"},{key:"주제",label:"주제 / 안건",type:"ta"},{key:"링크",label:"회의록",type:"link",linkText:"🎬 영상"}];
const SP_TPL={"회기":"","차수":"","일자":"","주제":"","링크":""};
const Q_COLS=[{key:"회기",label:"회기"},{key:"일자",label:"일자",type:"date"},{key:"제목",label:"제목",type:"ta"},{key:"답변조치",label:"답변 / 조치사항",type:"ta"},{key:"링크",label:"회의록",type:"link",linkText:"🎬 영상"}];
const MEETING_COLS=[{key:"회기",label:"회기",w:72},{key:"차수",label:"차수",w:56},{key:"일자",label:"일자",type:"date",w:110},{key:"회의",label:"회의 / 안건",w:170},{key:"주제",label:"발언 주제",type:"ta"},{key:"요지",label:"발언 요지",type:"ta"},{key:"링크",label:"회의록",type:"link",linkText:"🎬 회의록"}];
const MEETING_TPL={"회기":"","차수":"","일자":"","회의":"","주제":"","요지":"","링크":"","구분":"도의원(제12대)"};
const Q_TPL={"회기":"","일자":"","제목":"","답변조치":"","링크":""};

function badge(v){const m={"O":"o","△":"t","X":"x"};return `<span class="badge ${m[v]||'n'}">${v||'-'}</span>`;}

function sel(sec,i,k,val,opts){return `<select onchange="upd('${sec}',${i},'${k}',this.value)">`+opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join("")+`</select>`;}
function inp(sec,i,k,val){return `<input value="${esc(val).replace(/"/g,'&quot;')}" onchange="upd('${sec}',${i},'${k}',this.value)">`;}
function ta(sec,i,k,val){return `<textarea onchange="upd('${sec}',${i},'${k}',this.value)">${esc(val)}</textarea>`;}
function toISO(v){if(!v)return"";let s=String(v).trim().replace(/[.\/]/g,"-");const m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);return m?m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0"):"";}
function toDot(iso){const m=String(iso||"").match(/(\d{4})-(\d{2})-(\d{2})/);return m?m[1]+"."+m[2]+"."+m[3]:(iso||"");}
function dinp(sec,i,k,val){return `<span class="datewrap"><input type="date" value="${toISO(val)}" onchange="upd('${sec}',${i},'${k}',toDot(this.value))"><button class="today" title="오늘" onclick="setToday('${sec}',${i},'${k}')">오늘</button></span>`;}
function setToday(sec,i,k){const d=new Date();upd(sec,i,k,d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0"));render();}
function to24(v){if(!v)return"";var s=String(v).trim();var m=s.match(/(\d{1,2}):(\d{2})/);if(m)return String(m[1]).padStart(2,"0")+":"+m[2];m=s.match(/(오전|오후)?\s*(\d{1,2})\s*시\s*(\d{1,2})?/);if(m){var hh=parseInt(m[2],10);if(m[1]==="오후"&&hh<12)hh+=12;if(m[1]==="오전"&&hh===12)hh=0;return String(hh).padStart(2,"0")+":"+String(m[3]?parseInt(m[3],10):0).padStart(2,"0");}return"";}
function tinp(sec,i,k,val){return `<input type="time" value="${to24(val)}" onchange="upd('${sec}',${i},'${k}',this.value)">`;}

function tableSec(sec,cols,tpl,opts){

  if(state[sec].length===0 && !ed) return `<p class="muted" style="padding:8px 2px">아직 등록된 항목이 없습니다. (편집 모드에서 ‘+ 행 추가’로 입력)</p>`;
  // 내용 길이 비율로 열너비 %를 산출 → 가로 스크롤 없이 한 화면에 맞춤
  const disp=state[sec].map(row=>cols.map(c=>{
    const v=row[c.key];
    if(c.type==="report")return "보고서";
    if(c.type==="attendees")return (Array.isArray(v)?v.map(a=>(a.기관||"")+" "+(a.참석자||"")).join(" "):"");
    if(c.type==="link")return c.linkText||"링크";
    if(c.type==="badge")return "O";
    return v==null?"":String(v);
  }));
  let wt=colWeights(cols.map(c=>c.label),disp);
  cols.forEach((c,ci)=>{if(c.w)wt[ci]=c.w/7;});
  let allW=wt.concat(noDet?[]:[8]); if(ed)allW.push(3.5);
  const totW=allW.reduce((a,b)=>a+b,0)||1;
  const colg=`<colgroup>${allW.map(w=>`<col style="width:${(w/totW*100).toFixed(2)}%">`).join("")}</colgroup>`;
  let h=`<div class="scroll"><table>`+colg+`<thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join("")}${noDet?'':'<th>처리·자료</th>'}${ed?'<th></th>':''}</tr></thead><tbody>`;
  state[sec].forEach((row,i)=>{
    h+="<tr>"+cols.map(c=>{
      let v=row[c.key];
      if(c.type==="report")return `<td><button class="detbtn has" title="이 일정으로 보고서 만들기" onclick="scheduleReport(${i})">📄 보고서</button></td>`;
      if(c.type==="attendees")return attCell(sec,i,v,ed);
      if(!ed){
        if(c.type==="ta")return `<td style="white-space:pre-line">${koBreak(esc(v))}</td>`;
        if(c.type==="badge")return `<td>${badge(v)}</td>`;
        if(c.type==="tp")return `<td><span class="tp tp${tpClass(v)}">${esc(v)}</span></td>`;
        if(c.type==="status")return `<td><span class="st st${esc(v)}">${esc(v)}</span></td>`;
        if(c.type==="link")return `<td>${v?`<a class="link" href="${esc(v)}" target="_blank">${c.linkText||'원문'}</a>`:''}</td>`;
        return `<td>${koBreak(esc(v))}</td>`;
      }else{
        if(c.type==="badge")return `<td>${sel(sec,i,c.key,v,["O","△","X",""])}</td>`;
        if(c.type==="tp")return `<td>${sel(sec,i,c.key,v,["시장+국회 공통","시장 공통","국회 공통","부분 겹침","고유·기타","미검토"])}</td>`;
        if(c.type==="status")return `<td>${sel(sec,i,c.key,v,c.opts)}</td>`;
        if(c.type==="date")return `<td>${dinp(sec,i,c.key,v)}</td>`;
        if(c.type==="time")return `<td>${tinp(sec,i,c.key,v)}</td>`;
        if(c.type==="ta")return `<td>${ta(sec,i,c.key,v)}</td>`;
        return `<td>${inp(sec,i,c.key,v)}</td>`;
      }
    }).join("")+(noDet?'':`<td>${detailBtn(sec,i)}</td>`)+(ed?`<td><button class="rowdel" onclick="delRow('${sec}',${i})">✕</button></td>`:'')+"</tr>";
  });
  h+="</tbody></table></div>";
  if(ed)h+=`<button class="addrow" onclick='addRow("${sec}",${JSON.stringify(tpl)})'>+ 행 추가</button>`;
  return h;
}

/* ===== 이미지 자동 최적화(온라인용 축소·압축) ===== */
function b64size(d){var i=(d||"").indexOf(",");return i<0?0:Math.round((d.length-i-1)*0.75);}
function fmtSz(n){return n>=1048576?(n/1048576).toFixed(1)+"MB":Math.max(1,Math.round(n/1024))+"KB";}
function compressImage(file,maxSide,q){
  return new Promise(function(res){
    if(!/^image\//i.test(file.type)){var f0=new FileReader();f0.onload=function(e){res(e.target.result);};f0.readAsDataURL(file);return;}
    var fr=new FileReader();
    fr.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        var s=Math.min(1,maxSide/Math.max(w,h));
        var nw=Math.max(1,Math.round(w*s)),nh=Math.max(1,Math.round(h*s));
        try{
          var cv=document.createElement("canvas");cv.width=nw;cv.height=nh;
          var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,nw,nh);
          cx.drawImage(img,0,0,nw,nh);
          var out=cv.toDataURL("image/jpeg",q||0.72);
          res(out.length<e.target.result.length?out:e.target.result);
        }catch(err){res(e.target.result);}
      };
      img.onerror=function(){res(e.target.result);};
      img.src=e.target.result;
    };
    fr.readAsDataURL(file);
  });
}
function upPhoto(inp){const f=inp.files[0];if(!f)return;inp.value="";
  compressImage(f,520,0.82).then(function(url){state.profile.photo=url;render();toast("프로필 사진 최적화 "+fmtSz(f.size)+" → "+fmtSz(b64size(url)));});}

let detailCtx=null;
function ensureD(sec,i){const it=state[sec][i];if(!it._d)it._d={log:[],photos:[],files:[]};it._d.log=it._d.log||[];it._d.photos=it._d.photos||[];it._d.files=it._d.files||[];return it._d;}
function itemTitle(it){return it.공약||it.의안명||it.제목||it.주제||it.핵심과제||it.내용||it.구분||"항목";}
function todayStr(){const d=new Date();return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");}
function detailBtn(sec,i){
  const d=(state[sec][i]&&state[sec][i]._d)||{};
  const l=(d.log||[]).length,p=(d.photos||[]).length,f=(d.files||[]).length,a=l+p+f;
  const ed=mode==="edit";
  if(!a&&!ed) return `<span class="muted">–</span>`;                    /* 보기모드·기록없음 → 버튼 없음 */
  const label=a?('📝'+l+' 📷'+p+' 📎'+f):'＋기록';
  return `<button class="detbtn${a?' has':''}" title="${ed?'기록 추가·수정':'기록 보기(읽기 전용)'}" onclick="openDetail('${sec}',${i})">${label}</button>`;
}
function openDetail(sec,i){detailCtx={sec,i};history.pushState({detail:1},"","#detail");renderDetail();document.getElementById("modal").classList.add("open");}
function hideModal(){document.getElementById("modal").classList.remove("open");detailCtx=null;render();}
function closeDetail(){if(history.state&&history.state.detail){history.back();}else{hideModal();}}
function openImg(src){const w=window.open("");if(w)w.document.write('<img src="'+src+'" style="max-width:100%">');}
function addLog(){ensureD(detailCtx.sec,detailCtx.i).log.push({date:todayStr(),text:""});renderDetail();}
function delLog(j){ensureD(detailCtx.sec,detailCtx.i).log.splice(j,1);renderDetail();}
function updLog(j,k,v){ensureD(detailCtx.sec,detailCtx.i).log[j][k]=v;}
function upPhotoD(inp){
  var d=ensureD(detailCtx.sec,detailCtx.i),fs=[].slice.call(inp.files);inp.value="";
  if(!fs.length)return;
  var before=0,after=0,done=0;
  toast("사진 최적화 중…");
  fs.forEach(function(f){
    before+=f.size;
    compressImage(f,1280,0.72).then(function(url){
      after+=b64size(url);d.photos.push(url);done++;
      if(done===fs.length){renderDetail();toast("사진 "+fs.length+"장 최적화 "+fmtSz(before)+" → "+fmtSz(after));}
    });
  });
}
function delPhoto(j){ensureD(detailCtx.sec,detailCtx.i).photos.splice(j,1);renderDetail();}
function upFileD(inp){const d=ensureD(detailCtx.sec,detailCtx.i);[...inp.files].forEach(f=>{const r=new FileReader();r.onload=e=>{d.files.push({name:f.name,data:e.target.result});renderDetail();};r.readAsDataURL(f);});inp.value="";}
function delFile(j){ensureD(detailCtx.sec,detailCtx.i).files.splice(j,1);renderDetail();}
function updFileName(j,v){ensureD(detailCtx.sec,detailCtx.i).files[j].name=v;}
function renderDetail(){
  const {sec,i}=detailCtx;const it=state[sec][i];const d=ensureD(sec,i);const ed=mode==="edit";
  document.getElementById("modaltitle").textContent=itemTitle(it);
  let h=ed?'':'<div class="notice">👁 <b>보기 모드</b>입니다. 기록을 추가·수정하려면 상단 스위치를 <b>편집</b>으로 바꾸세요.</div>';
  h+='<div class="dsec"><h4>📝 처리 과정</h4>';
  if(!d.log.length&&!ed)h+='<div class="muted">기록 없음</div>';
  d.log.forEach((lg,j)=>{h+=ed
    ?`<div class="logitem"><input type="date" style="width:140px" value="${toISO(lg.date)}" onchange="updLog(${j},'date',toDot(this.value))"><input value="${esc(lg.text).replace(/"/g,'&quot;')}" placeholder="처리 내용" onchange="updLog(${j},'text',this.value)"><button class="rowdel" onclick="delLog(${j})">✕</button></div>`
    :`<div class="logitem"><span class="ld">${esc(lg.date)}</span><span>${esc(lg.text)}</span></div>`;});
  if(ed)h+='<button class="addrow" onclick="addLog()">+ 처리기록 추가</button>';
  h+='</div><div class="dsec"><h4>📷 사진</h4>';
  if(!d.photos.length&&!ed)h+='<div class="muted">사진 없음</div>';
  h+='<div class="thumbs">'+d.photos.map((p,j)=>`<div class="th2"><img src="${p}" onclick="openImg(this.src)">${ed?`<button onclick="delPhoto(${j})">✕</button>`:''}<div class="szlab">${fmtSz(b64size(p))}</div></div>`).join("")+'</div>';
  if(ed)h+='<input class="up" type="file" accept="image/*" multiple onchange="upPhotoD(this)">'
        +'<div class="muted" style="margin-top:4px">※ 올리면 자동으로 <b>최대 1280px·JPEG 품질 72%</b>로 줄여 저장합니다(온라인용 용량 최적화).</div>';
  h+='</div><div class="dsec"><h4>📎 첨부파일</h4>';
  if(!d.files.length&&!ed)h+='<div class="muted">파일 없음</div>';
  h+=d.files.map((f,j)=>ed
    ?`<div class="fitem"><input value="${esc(f.name).replace(/"/g,'&quot;')}" onchange="updFileName(${j},this.value)" style="flex:1;margin-right:8px" title="파일 이름 수정"><a class="link" href="${f.data}" download="${esc(f.name)}" style="margin-right:10px;white-space:nowrap">⬇ 받기</a><button class="rowdel" onclick="delFile(${j})">✕ 삭제</button></div>`
    :`<div class="fitem"><a href="${f.data}" download="${esc(f.name)}">📄 ${esc(f.name)}</a></div>`).join("");
  if(ed)h+='<input class="up" type="file" multiple onchange="upFileD(this)">';
  h+='</div>';
  if(ed)h+='<div style="margin-top:18px;text-align:right"><button class="btn" style="background:var(--main);color:#fff" onclick="saveState();closeDetail()">💾 저장하고 닫기</button></div>';
  document.getElementById("modalbody").innerHTML=h;
}
/* ===== 페이지별 다운로드 (엑셀 CSV / 한글 DOC) ===== */
function tabLabel(t){var f=TABS.find(function(x){return x[0]===t;});return f?f[1].replace(/[^가-힣A-Za-z0-9()·]/g,"").trim():t;}
function logText(r){var d=(r&&r._d&&r._d.log)||[];return d.map(function(l){return (l.date||"")+" "+(l.text||"");}).join(" / ");}
function attachText(r){var d=(r&&r._d)||{};var p=(d.photos||[]).length,f=(d.files||[]).length;return (p?"사진 "+p+"건 ":"")+(f?"파일 "+f+"건":"");}
function secBlock(title,sec,cols){
  cols=cols.filter(function(c){return c.type!=="report"&&String(c.key).indexOf("__")!==0;});
  var head=cols.map(function(c){return c.label;}).concat(["처리 과정","첨부"]);
  var links={};cols.forEach(function(c,i){if(c.type==="link")links[i]=(c.linkText||"원문").replace(/[^가-힣A-Za-z0-9]/g,"")||"원문";});
  var rows=(state[sec]||[]).map(function(r){return cols.map(function(c){
    if(c.type==="attendees"){var a=r[c.key]||[];return a.map(function(x){return (x.기관||"")+(x.참석자?(": "+String(x.참석자).replace(/\n/g,", ")):"");}).join("\n");}
    return r[c.key]==null?"":String(r[c.key]);
  }).concat([logText(r),attachText(r)]);});
  return {title:title,head:head,rows:rows,links:links};
}
function blocksFor(t){
  var B=[],p=state.profile;
  if(t==="profile"){
    B.push({title:"의원 프로필",head:["항목","내용"],rows:[["성명",p.name],["소속 정당",p.party],["현 직위",p.position],["선거구 (관할 동)",p.district],["위원회",p.committee],["임기",p.term],["슬로건",p.slogan],["사무소",p.contact.office],["전화",p.contact.tel],["이메일",p.contact.email]]});
    B.push({title:"학력",head:["학교","전공","학위"],rows:(p.edu||[]).map(function(r){return r.slice();})});
    B.push({title:"주요 경력",head:["기간","직위","기관"],rows:(p.career||[]).map(function(r){return r.slice();})});
    B.push(secBlock("의정활동 우선순위 (1~10)","priorities",PRI_COLS));
    B.push({title:"의정활동 방향 · 자유 메모",head:["내용"],rows:[[state.direction||""]]});
  }
  else if(t==="pledges")B.push(secBlock("공약 관리","pledges",PLEDGE_COLS));
  else if(t==="do_ord")B.push(secBlock("조례 발의 (경기도의회 제12대)","do_ordinances",ORD_COLS));
  else if(t==="do_sp")B.push(secBlock("5분 자유발언 (경기도의회 제12대)","do_speech5",SP_COLS));
  else if(t==="do_q")B.push(secBlock("도정질문 (경기도의회 제12대)","do_questions",Q_COLS));
  else if(t==="do_media")B.push(secBlock("기고·인터뷰 (경기도의회 제12대)","do_media",MEDIA_COLS));
  else if(t==="minwon")B.push(secBlock("민원 관리","minwon",MINWON_COLS));
  else if(t==="schedule")B.push(secBlock("일정 관리","schedule",SCHED_COLS));
  else if(t==="si"){
    B.push(secBlock("대표발의 조례·규칙 (오산시의회 제9대)","si_ordinances",ORD_COLS));
    B.push(secBlock("5분(7분) 자유발언 (제9대)","si_speech5",SP_COLS));
    B.push(secBlock("시정질문 (제9대)","si_questions",Q_COLS));
    B.push(secBlock("기고·인터뷰 (제9대)","si_media",MEDIA_COLS));
  }
  return B;
}
function csvEsc(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}
function buildCSV(B){var L=[];B.forEach(function(b){L.push(csvEsc("■ "+b.title));L.push(b.head.map(csvEsc).join(","));if(!b.rows.length)L.push(csvEsc("(내용 없음)"));b.rows.forEach(function(r){L.push(r.map(csvEsc).join(","));});L.push("");});return "﻿"+L.join("\r\n");}
/* ===== RTF(한글에서 경고 없이 열림) ===== */
function rtfT(s){s=String(s==null?"":s);var o="";for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);
  if(c===0x5c)o+="\\\\";else if(c===0x7b)o+="\\{";else if(c===0x7d)o+="\\}";
  else if(c===10||c===13){if(c===13&&s.charCodeAt(i+1)===10)i++;o+="\\line ";}
  else if(c<128)o+=s.charAt(i);else o+="\\u"+(c>32767?c-65536:c)+"?";}return o;}
function rtfUrl(u){return String(u).replace(/\\/g,"\\\\").replace(/{/g,"\\{").replace(/}/g,"\\}");}
function rtfHeader(){return "{\\rtf1\\ansi\\ansicpg949\\deff0{\\fonttbl{\\f0\\fnil Malgun Gothic;}}{\\colortbl ;\\red26\\green58\\blue108;\\red255\\green255\\blue255;\\red220\\green230\\blue241;\\red5\\green99\\blue193;}\\viewkind4\\uc1\\f0\\fs20\n";}
function rtfTable(head,rows,links){
  links=links||{};var W=9020,C=head.length;
  var disp=rows.map(function(r){return r.map(function(v,ci){return (links[ci]&&/^https?:/i.test(v))?links[ci]:v;});});
  var wt=colWeights(head,disp),tot=wt.reduce(function(a,x){return a+x;},0)||1,edges=[],acc=0;
  for(var i=0;i<C;i++){acc+=Math.max(500,Math.round(W*wt[i]/tot));edges.push(acc);}
  function rowdef(sh){var r="\\trowd\\trgaph80\\trleft0";for(var i=0;i<C;i++){r+="\\clbrdrt\\brdrs\\brdrw10\\clbrdrl\\brdrs\\brdrw10\\clbrdrb\\brdrs\\brdrw10\\clbrdrr\\brdrs\\brdrw10"+(sh?"\\clcbpat"+sh:"")+"\\cellx"+edges[i];}return r;}
  var s=rowdef(4);
  for(var i=0;i<C;i++)s+="\\pard\\intbl\\qc\\b\\cf1 "+rtfT(head[i])+"\\cell";
  s+="\\b0\\cf0\\row\n";
  if(!rows.length){s+=rowdef(0)+"\\pard\\intbl\\ql "+rtfT("(내용 없음)")+"\\cell";for(var j=1;j<C;j++)s+="\\cell";s+="\\row\n";}
  rows.forEach(function(r){
    s+=rowdef(0);
    for(var ci=0;ci<C;ci++){var v=r[ci],isL=links[ci]&&/^https?:/i.test(v);
      if(isL)s+="\\pard\\intbl\\qc{\\field{\\*\\fldinst HYPERLINK \""+rtfUrl(v)+"\"}{\\fldrslt \\cf4\\ul "+rtfT(links[ci])+"}}\\cell";
      else s+="\\pard\\intbl\\ql "+rtfT(v)+"\\cell";}
    s+="\\row\n";
  });
  return s;
}
function buildRTF(B,title){
  var s=rtfHeader();
  s+="\\qc\\b\\fs32 "+rtfT(title)+"\\par\\qc\\fs16 "+rtfT(state.profile.name+" 의원 · "+state.profile.position+" · 출력 "+todayStr())+"\\par\\pard\\ql\\b0\\fs20\n";
  B.forEach(function(b){
    s+="\\par\\b\\fs24\\cf1 "+rtfT("■ "+b.title)+"\\par\\pard\\b0\\fs20\\cf0\n";
    s+=rtfTable(b.head,b.rows,b.links);
  });
  return s+"}";
}

    var cols="<cols>"+wt.map(function(w,i){return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+Math.max(8,Math.min(w*1.15+2,60)).toFixed(1)+'" customWidth="1"/>';}).join("")+"</cols>";
    var rowsXml='<row r="1" ht="22" customHeight="1">'+b.head.map(function(hd,i){return '<c r="'+colL(i+1)+'1" s="1" t="inlineStr"><is><t xml:space="preserve">'+xe(hd)+'</t></is></c>';}).join("")+"</row>";
    var hls=[],hn=1;
    b.rows.forEach(function(r,ri){
      rowsXml+='<row r="'+(ri+2)+'">'+b.head.map(function(_,ci){
        var raw=r[ci], isL=lk[ci]&&/^https?:\/\//i.test(raw), ref=colL(ci+1)+(ri+2);
        if(isL)hls.push({ref:ref,url:raw,id:"rIdL"+(hn++)});
        return '<c r="'+ref+'" s="'+(isL?3:2)+'" t="inlineStr"><is><t xml:space="preserve">'+xe(isL?lk[ci]:raw)+'</t></is></c>';
      }).join("")+"</row>";
    });
    var hlXml=hls.length?("<hyperlinks>"+hls.map(function(h){return '<hyperlink ref="'+h.ref+'" r:id="'+h.id+'"/>';}).join("")+"</hyperlinks>"):"";
    parts.push({name:"xl/worksheets/sheet"+(si+1)+".xml",data:enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
      +cols+"<sheetData>"+rowsXml+"</sheetData><autoFilter ref=\"A1:"+colL(b.head.length)+Math.max(1,b.rows.length+1)+"\"/>"+hlXml+"</worksheet>")});
    if(hls.length)parts.push({name:"xl/worksheets/_rels/sheet"+(si+1)+".xml.rels",data:enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      +hls.map(function(h){return '<Relationship Id="'+h.id+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="'+xe(h.url)+'" TargetMode="External"/>';}).join("")+'</Relationships>')});
    sheets.push({name:name,id:si+1});
  });
  parts.push({name:"[Content_Types].xml",data:enc.encode(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>'
    +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    +sheets.map(function(s){return '<Override PartName="/xl/worksheets/sheet'+s.id+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';}).join("")
    +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>')});
  parts.push({name:"_rels/.rels",data:enc.encode(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')});
  parts.push({name:"xl/workbook.xml",data:enc.encode(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
    +sheets.map(function(s){return '<sheet name="'+xe(s.name)+'" sheetId="'+s.id+'" r:id="rId'+s.id+'"/>';}).join("")+'</sheets></workbook>')});
  parts.push({name:"xl/_rels/workbook.xml.rels",data:enc.encode(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +sheets.map(function(s){return '<Relationship Id="rId'+s.id+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+s.id+'.xml"/>';}).join("")
    +'<Relationship Id="rId900" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>')});
  parts.push({name:"xl/styles.xml",data:enc.encode(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    +'<fonts count="3"><font><sz val="10"/><name val="맑은 고딕"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="맑은 고딕"/></font><font><u/><sz val="10"/><color rgb="FF0563C1"/><name val="맑은 고딕"/></font></fonts>'
    +'<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1A3A6C"/><bgColor indexed="64"/></patternFill></fill></fills>'
    +'<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border></borders>'
    +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    +'<cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
    +'<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'
    +'<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>'
    +'<xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf></cellXfs>'
    +'<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>')});
  return zipStore(parts,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}
function dlBlob(blob,fname){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},600);}
function dl(content,fname,mime){var b=new Blob([content],{type:mime});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fname;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},600);}
function downloadTab(){
  var fmt=document.getElementById("dlfmt").value, B=blocksFor(tab), name=tabLabel(tab);
  var base=state.profile.name+"_"+name+"_"+todayStr().replace(/\./g,"");
  if(fmt==="excel"){try{dlBlob(buildXLSX(B),base+".xlsx");toast("엑셀(xlsx)로 저장했습니다 ✓");}catch(e){dl(buildCSV(B),base+".csv","text/csv;charset=utf-8;");toast("xlsx 생성 실패 → CSV로 저장했습니다");}}
  else if(fmt==="hwp"){buildHWPX(B,state.profile.name+" 의원 — "+name).then(function(blob){dlBlob(blob,base+".hwpx");toast("한글(hwpx)로 저장했습니다 ✓");}).catch(function(e){dl(buildRTF(B,state.profile.name+" 의원 — "+name),base+".rtf","application/rtf;charset=utf-8");toast("hwpx 실패 → RTF로 저장");});}
  else{dl(buildRTF(B,state.profile.name+" 의원 — "+name),base+".rtf","application/rtf;charset=utf-8");toast("한글(.rtf)로 저장했습니다 ✓");}
}
/* ===== 일정 → 1페이지 보고서(RTF, 한글에서 열림 · 사진 삽입 · 첨부는 별첨) ===== */
function dataURLbytes(u){var i=String(u).indexOf(",");return i<0?new Uint8Array():b64bytes(String(u).slice(i+1));}
function safeName(s){return String(s||"파일").replace(/[\\/:*?"<>|]/g,"_").slice(0,60);}
function toHex(u){var H="0123456789abcdef",o="";for(var i=0;i<u.length;i++)o+=H[u[i]>>4]+H[u[i]&15];return o;}
function imgDim(u){return new Promise(function(res){var im=new Image();im.onload=function(){res({w:im.naturalWidth||300,h:im.naturalHeight||200});};im.onerror=function(){res({w:300,h:200});};im.src=u;});}
function rtfPict(u,w,h){var jpg=/^data:image\/jpe?g/i.test(u);var gw=Math.min(4600,Math.round(w*15));var gh=Math.max(1,Math.round(gw*h/(w||1)));
  return "{\\pict\\"+(jpg?"jpegblip":"pngblip")+"\\picwgoal"+gw+"\\pichgoal"+gh+"\n"+toHex(dataURLbytes(u))+"}";}
function reportBlocks(r){
  var d=(r._d)||{},log=d.log||[],photos=d.photos||[],files=d.files||[];
  var when=(r.일시||"")+(r.시간?(" "+r.시간):""), att=Array.isArray(r.참석)?r.참석:[];
  var B=[];
  B.push({title:"개요",head:["항목","내용"],rows:[["일시",when],["구분",r.구분||""],["장소",r.장소||""]]});
  B.push({title:"참석 (기관별)",head:["기관·단체","참석자"],rows:att.length?att.map(function(a){return [a.기관||"",(a.참석자||"").replace(/\n/g,", ")];}):[["-","-"]]});
  B.push({title:"주요 내용",head:["내용"],rows:[[(r.내용||"")+(r.메모?("\n[메모] "+r.메모):"")]]});
  if(log.length)B.push({title:"처리 경과",head:["일자","내용"],rows:log.map(function(l){return [l.date||"",l.text||""];})});
  var ex=[];if(photos.length)ex.push(["사진 "+photos.length+"장 (별첨 폴더 참조)"]);files.forEach(function(f,j){ex.push([(j+1)+". "+f.name+" (별첨)"]);});
  B.push({title:"별첨",head:["별첨 목록"],rows:ex.length?ex:[["없음"]]});
  return B;
}
function scheduleReport(i){
  var r=state.schedule[i]||{}, d=(r._d)||{}, photos=d.photos||[], files=d.files||[];
  var title=state.profile.name+" 의원 — "+(r.구분||"일정")+" 결과 보고";
  var base=state.profile.name+"_일정보고서_"+safeName(r.구분||"")+"_"+(r.일시||todayStr()).replace(/[.\s]/g,"");
  buildHWPX(reportBlocks(r),title).then(function(hwpx){
    if(photos.length||files.length){
      hwpx.arrayBuffer().then(function(buf){
        var ents=[{name:base+".hwpx",data:new Uint8Array(buf)}];
        photos.forEach(function(p,j){var ext=/^data:image\/png/i.test(p)?"png":"jpg";ents.push({name:"별첨/사진"+String(j+1).padStart(2,"0")+"."+ext,data:dataURLbytes(p)});});
        files.forEach(function(f,j){ents.push({name:"별첨/"+String(j+1).padStart(2,"0")+"_"+safeName(f.name),data:dataURLbytes(f.data)});});
        dlBlob(zipStore(ents,"application/zip"),base+"_별첨포함.zip");toast("보고서(hwpx)+별첨 "+(photos.length+files.length)+"건 zip 저장 ✓");
      });
    }else{dlBlob(hwpx,base+".hwpx");toast("일정 보고서(hwpx) 저장 ✓");}
  });
}
function render(){renderNav();renderContent();}
window.addEventListener("popstate",function(e){
  var modal=document.getElementById("modal");
  if(modal.classList.contains("open")){modal.classList.remove("open");detailCtx=null;render();return;}
  var t=(e.state&&e.state.tab)||(location.hash?decodeURIComponent(location.hash.slice(1)):"profile");
  if(!TABS.some(function(x){return x[0]===t;}))t="profile";
  tab=t;render();window.scrollTo(0,0);
});
(function(){var t=location.hash?decodeURIComponent(location.hash.slice(1)):"profile";if(!TABS.some(function(x){return x[0]===t;}))t="profile";tab=t;history.replaceState({tab:t},"","#"+t);})();
render();
</script>
